<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aviator Predictor Pro</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>AVIATOR PREDICTOR PRO</h1>
  <p>Created by CHINOIS</p>

  <input
    type="number"
    id="multiplicateur"
    placeholder="Exemple : 2.35"
    step="0.01"
  >

  <br>

  <button onclick="ajouterMultiplicateur()">
    Ajouter le résultat
  </button>

  <h2>Analyse statistique</h2>

  <div>
    <p>Nombre de résultats : <strong id="nombre">0</strong></p>
    <p>Moyenne : <strong id="moyenne">0.00x</strong></p>
    <p>Minimum : <strong id="minimum">0.00x</strong></p>
    <p>Maximum : <strong id="maximum">0.00x</strong></p>
    <p>Indicateur : <strong id="niveau">-</strong></p>
  </div>

  <script src="script.js"></script>

</body>
</html>
